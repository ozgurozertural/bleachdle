<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bleachdle — Classic Mode</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico" sizes="any">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e5e2d5">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html" aria-label="Ana sayfa">
    <span class="kanji">死</span><h1>BLEACHDLE</h1>
  </a>
  <nav class="mode-nav" aria-label="Modlar">
    <a href="classic.html" data-key="1" aria-keyshortcuts="1" aria-current="page"><span lang="en">Classic</span></a>
    <a href="quote.html" data-key="2" aria-keyshortcuts="2"><span lang="en">Quote</span></a>
    <a href="splash.html" data-key="3" aria-keyshortcuts="3"><span lang="en">Splash</span></a>
    <a href="bankai.html" data-key="4" aria-keyshortcuts="4"><span lang="en">Bankai</span></a>
  </nav>
  <button id="theme-toggle" class="theme-toggle" aria-label="Tema değiştir">🌓</button>
</header>

<main class="game-page">
  <a class="back-link" href="index.html">← Ana menü</a>
  <h2 class="game-title">CLASSIC MODE</h2>
  <p class="game-subtitle">Bir Bleach karakteri tahmin et. Her tahmin sana yeni ipuçları verir.</p>

  <div class="mode-switch">
    <button class="active" data-mode="daily">Günün karakteri</button>
    <button data-mode="free">Serbest oyun</button>
  </div>

  <div class="search-box">
    <input id="search" type="text" autocomplete="off" placeholder="Karakter adı yazın..." />
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div id="result"></div>

  <div class="guess-table-wrap">
    <table class="guess-table">
      <thead>
        <tr>
          <th>Görsel</th>
          <th>İsim</th>
          <th>Cinsiyet</th>
          <th>Irk</th>
          <th>Yaş</th>
          <th>Boy</th>
          <th>Saç Rengi</th>
          <th>Bölge</th>
          <th>İlk Arc</th>
        </tr>
      </thead>
      <tbody id="guesses"></tbody>
    </table>
  </div>
</main>

<footer class="site-footer">
  <p>Fan proje · Karakter verisi ve görseller <a href="https://bleach.fandom.com" target="_blank" rel="noopener">Bleach Wiki</a>'den · Tite Kubo &copy; Shueisha</p>
</footer>

<script src="js/theme.js"></script>
<script src="js/nav.js"></script>
<script src="js/stats.js"></script>
<script src="js/game-core.js"></script>
<script src="js/data.js"></script>
<script src="js/classic.js"></script>
</body>
</html>
