<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="title.bankai">Bleachdle — Bankai Mode</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico" sizes="any">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e5e2d5">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html" data-i18n-aria="brand.aria">
    <span class="kanji">卍</span><h1>BLEACHDLE</h1>
  </a>
  <nav class="mode-nav" data-i18n-aria="nav.aria">
    <a href="classic.html"><span lang="en">Classic</span></a>
    <a href="quote.html"><span lang="en">Quote</span></a>
    <a href="splash.html"><span lang="en">Splash</span></a>
    <a href="bankai.html" aria-current="page"><span lang="en">Bankai</span></a>
  </nav>
  <div class="lang-select">
    <button class="lang-btn" aria-haspopup="listbox" aria-expanded="false"
            data-i18n="lang.short" data-i18n-aria="lang.aria">TR</button>
    <ul class="lang-menu" role="listbox">
      <li><button role="option" data-lang="tr" data-i18n="lang.tr">Türkçe</button></li>
      <li><button role="option" data-lang="en" data-i18n="lang.en">English</button></li>
    </ul>
  </div>
  <button id="theme-toggle" class="theme-toggle" data-i18n-aria="theme.aria">🌓</button>
</header>

<main class="game-page">
  <a class="back-link" href="index.html" data-i18n="back">← Ana menü</a>
  <h2 class="game-title">BANKAI MODE</h2>
  <p class="game-subtitle" data-i18n="sub.bankai"></p>

  <div class="mode-switch">
    <button class="active" data-mode="daily" data-i18n="daily.bankai">Günün bankai'si</button>
    <button data-mode="free" data-i18n="free">Serbest oyun</button>
  </div>

  <div id="quote-display" class="quote-display">Yükleniyor...</div>

  <div id="bankai-hint-slot"></div>

  <div class="search-box">
    <input id="search" type="text" autocomplete="off" data-i18n-placeholder="search.placeholder" placeholder="Karakter adı yazın..." />
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div id="result"></div>
  <div id="attempts" class="attempts-info"></div>
</main>

<footer class="site-footer">
  <p data-i18n-html="footer.short"></p>
</footer>

<script src="js/i18n.js"></script>
<script src="js/theme.js"></script>
<script src="js/stats.js"></script>
<script src="js/game-core.js"></script>
<script src="js/data.js"></script>
<script src="js/simple-mode.js"></script>
<script>
const HINT_AT = 5;
const BANKAI = fetch('data/bankai.json').then(r => r.json()).catch(() => ({}));
initSimpleMode({
  modeKey: 'bankai',
  maxGuesses: 8,
  pool: async (chars) => {
    const b = await BANKAI;
    return chars.filter(c => b[c.id]);
  },
  loadPrompt: async (answer) => {
    const b = (await BANKAI)[answer.id];
    const el = document.getElementById('quote-display');
    document.getElementById('bankai-hint-slot').innerHTML = '';
    if (!b) { el.innerHTML = `<em>${t('bankai.none')}</em>`; return false; }
    el.innerHTML = `
      <div class="release-name">
        ${b.name || '???'}
      </div>
      <div class="release-meta">
        ${b.type || ''}${b.ability ? ' · ' + b.ability : ''}
      </div>`;
    return true;
  },
  onGuess: (guesses, answer, finished) => {
    // 5. yanlış tahminden sonra karakterin görseli ipucu olarak açılır (finish değilse)
    if (!finished && guesses.length >= HINT_AT && answer.image) {
      const slot = document.getElementById('bankai-hint-slot');
      if (!slot.innerHTML) {
        slot.innerHTML = `
          <div class="bankai-hint-label">${t('hint.last')}</div>
          <div class="bankai-hint">
            <img src="${answer.image}" alt="hint" style="filter:blur(4px)">
          </div>
        `;
      }
    }
  }
});
</script>
</body>
</html>
