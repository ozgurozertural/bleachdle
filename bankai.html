<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Satır içi script ve stil yok: hepsi ayrı dosyada, o yüzden 'unsafe-inline'
     gerekmiyor. Dış kaynak da yok (fontlar kendi barındırmamızda), o yüzden
     her şey 'self'. Kazınan veri innerHTML'e giriyor — bu, js/i18n.js'teki
     esc() kaçışının arkasındaki ikinci savunma hattı. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title data-i18n="title.bankai">Bleachdle — Bankai Mode</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico" sizes="any">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e5e2d5">

<meta name="description" content="Bu Bankai, Shikai ya da Resurrección kime ait? Sekiz hakkın var.">
<link rel="canonical" href="https://ozgurozertural.github.io/bleachdle/bankai.html">

<!-- Paylaşım kartı. Tarayıcı-dışı kazıyıcılar JS çalıştırmaz, o yüzden burası
     data-i18n'den bağımsız ve sabit Türkçe. og.jpg'yi scripts/make_og.py üretir. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bleachdle">
<meta property="og:locale" content="tr_TR">
<meta property="og:locale:alternate" content="en_US">
<meta property="og:url" content="https://ozgurozertural.github.io/bleachdle/bankai.html">
<meta property="og:title" content="Bleachdle — Bankai Mode">
<meta property="og:description" content="Bu Bankai, Shikai ya da Resurrección kime ait? Sekiz hakkın var.">
<meta property="og:image" content="https://ozgurozertural.github.io/bleachdle/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Bleachdle — Espada toplantısının önünde BLEACHDLE başlığı ve dört mod: Classic, Quote, Splash, Bankai">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html" data-i18n-aria="brand.aria">
    <span class="kanji">卍</span><h1>BLEACHDLE</h1>
  </a>
  <nav class="mode-nav" data-i18n-aria="nav.aria">
    <a href="classic.html"><span lang="en">Classic</span></a>
    <a href="quote.html"><span lang="en">Quote</span></a>
    <a href="splash.html"><span lang="en">Splash</span></a>
    <a href="bankai.html" aria-current="page"><span lang="en">Bankai</span></a>
  </nav>
  <div class="lang-select">
    <button class="lang-btn" aria-haspopup="listbox" aria-expanded="false"
            data-i18n="lang.short" data-i18n-aria="lang.aria">TR</button>
    <ul class="lang-menu" role="listbox">
      <li><button role="option" data-lang="tr" data-i18n="lang.tr">Türkçe</button></li>
      <li><button role="option" data-lang="en" data-i18n="lang.en">English</button></li>
    </ul>
  </div>
  <div class="theme-toggle" role="group" data-i18n-aria="theme.aria">
    <button data-set-theme="light" data-i18n-aria="theme.light">昼</button>
    <button data-set-theme="dark" data-i18n-aria="theme.dark">夜</button>
  </div>
</header>

<main class="game-page">
  <a class="back-link" href="index.html" data-i18n="back">← Ana menü</a>
  <h2 class="game-title">BANKAI MODE</h2>
  <p class="game-subtitle" data-i18n="sub.bankai"></p>

  <div class="mode-switch">
    <button class="active" data-mode="daily" data-i18n="daily.bankai">Günün bankai'si</button>
    <button data-mode="free" data-i18n="free">Serbest oyun</button>
  </div>

  <div id="quote-display" class="quote-display">Yükleniyor...</div>

  <div id="bankai-hint-slot"></div>

  <div class="search-box">
    <input id="search" type="text" autocomplete="off" data-i18n-placeholder="search.placeholder" placeholder="Karakter adı yazın..." />
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div id="result"></div>
  <div id="attempts" class="attempts-info"></div>
</main>

<footer class="site-footer">
  <p data-i18n-html="footer.short"></p>
</footer>

<script src="js/i18n.js"></script>
<script src="js/theme.js"></script>
<script src="js/stats.js"></script>
<script src="js/game-core.js"></script>
<script src="js/data.js"></script>
<script src="js/simple-mode.js"></script>
<script src="js/bankai.js"></script>
</body>
</html>
