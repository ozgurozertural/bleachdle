<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="title.index">Bleachdle — Bleach karakter tahmin oyunu</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico" sizes="any">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e5e2d5">

<meta name="description" content="Her gün yeni bir Bleach karakteri. Classic, Quote, Splash ve Bankai modlarıyla kaç denemede bileceksin?">
<link rel="canonical" href="https://ozgurozertural.github.io/bleachdle/">

<!-- Paylaşım kartı. Tarayıcı-dışı kazıyıcılar JS çalıştırmaz, o yüzden burası
     data-i18n'den bağımsız ve sabit Türkçe. og.jpg'yi scripts/make_og.py üretir. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bleachdle">
<meta property="og:locale" content="tr_TR">
<meta property="og:locale:alternate" content="en_US">
<meta property="og:url" content="https://ozgurozertural.github.io/bleachdle/">
<meta property="og:title" content="Bleachdle — Bleach karakter tahmin oyunu">
<meta property="og:description" content="Her gün yeni bir Bleach karakteri. Classic, Quote, Splash ve Bankai modlarıyla kaç denemede bileceksin?">
<meta property="og:image" content="https://ozgurozertural.github.io/bleachdle/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Bleachdle — Espada toplantısının önünde BLEACHDLE başlığı ve dört mod: Classic, Quote, Splash, Bankai">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html" data-i18n-aria="brand.aria">
    <span class="kanji">死</span><h1>BLEACHDLE</h1>
  </a>
  <nav class="mode-nav" data-i18n-aria="nav.aria">
    <a href="classic.html"><span lang="en">Classic</span></a>
    <a href="quote.html"><span lang="en">Quote</span></a>
    <a href="splash.html"><span lang="en">Splash</span></a>
    <a href="bankai.html"><span lang="en">Bankai</span></a>
  </nav>
  <div class="lang-select">
    <button class="lang-btn" aria-haspopup="listbox" aria-expanded="false"
            data-i18n="lang.short" data-i18n-aria="lang.aria">TR</button>
    <ul class="lang-menu" role="listbox">
      <li><button role="option" data-lang="tr" data-i18n="lang.tr">Türkçe</button></li>
      <li><button role="option" data-lang="en" data-i18n="lang.en">English</button></li>
    </ul>
  </div>
  <button id="theme-toggle" class="theme-toggle" data-i18n-aria="theme.aria">🌓</button>
</header>

<main class="hub">
  <p class="tagline" data-i18n-html="tagline"></p>

  <div class="mode-grid">
    <a class="mode-card" href="classic.html">
      <div class="mode-icon">名</div>
      <h2 lang="en">Classic</h2>
      <p data-i18n="card.classic"></p>
    </a>
    <a class="mode-card" href="quote.html">
      <div class="mode-icon">言</div>
      <h2 lang="en">Quote</h2>
      <p data-i18n="card.quote"></p>
    </a>
    <a class="mode-card" href="splash.html">
      <div class="mode-icon">影</div>
      <h2 lang="en">Splash</h2>
      <p data-i18n="card.splash"></p>
    </a>
    <a class="mode-card" href="bankai.html">
      <div class="mode-icon">卍</div>
      <h2 lang="en">Bankai</h2>
      <p data-i18n="card.bankai"></p>
    </a>
  </div>

  <section class="stats-panel">
    <h3 data-i18n="stats.title"></h3>
    <div id="stats-summary" class="stats-summary">
      <div><span class="stat-val" data-stat="streak">0</span><span class="stat-label" data-i18n="stats.streak"></span></div>
      <div><span class="stat-val" data-stat="maxStreak">0</span><span class="stat-label" data-i18n="stats.best"></span></div>
      <div><span class="stat-val" data-stat="played">0</span><span class="stat-label" data-i18n="stats.played"></span></div>
      <div><span class="stat-val" data-stat="winRate">0%</span><span class="stat-label" data-i18n="stats.winrate"></span></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p data-i18n-html="footer.long"></p>
</footer>

<script src="js/i18n.js"></script>
<script src="js/theme.js"></script>
<script src="js/stats.js"></script>
<script>renderStatsSummary(document.getElementById('stats-summary'));</script>
</body>
</html>
